# DigitalOcean App Platform spec — SmartFund.
#
# This spec deploys the React SPA as a STATIC SITE on App Platform's free tier.
# The .NET API is NOT deployed here because App Platform cannot host SQL Server
# (DO has no Managed SQL Server, and App Platform components are stateless).
#
# Path to a fully working public deployment:
#   1. Apply this spec  →  https://<app>.ondigitalocean.app serves the SPA.
#   2. Deploy the API on a Droplet using docker-compose.yml + deploy.md.
#   3. Point the SPA at that API by setting VITE_API_BASE_URL below to the
#      Droplet's public URL (e.g. https://api.yourdomain.com).
#   4. Redeploy the static site (it picks up the env var at build time).
#
# Until step 2 is done, the SPA loads but every API call returns a network
# error — that's expected and matches the "frontend up, backend pending" state.

name: smartfund
region: fra

static_sites:
  - name: web
    # Build the SPA from the SmartFund.Web subdirectory of the repo.
    source_dir: /SmartFund.Web
    github:
      repo: Mbah-Ernest/SmartFund
      branch: feature/transaction-intelligence
      deploy_on_push: true

    build_command: npm ci && npm run build
    output_dir: dist

    # Public-facing route. `path: /` makes this component the catch-all.
    routes:
      - path: /

    # SPA fallback — any unmatched path returns index.html so React Router can handle it.
    catchall_document: index.html

    # Build-time env var. Leave blank to call /api on the same origin; set to
    # your Droplet API URL once it's deployed.
    envs:
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: ""        # e.g. https://api.smartfund.example/api

# -----------------------------------------------------------------------------
